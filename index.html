<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="description" content="Hatem — ideas, design experiences, and imagination turned into reality." />
    <title>HATEM — Home</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="site" class="site-shell" data-page="home">
      <h1 class="sr-only" id="page-title">Hatem personal portfolio</h1>
      <section class="artboard artboard--home" aria-labelledby="page-title">
        <img class="reference-art reference-art--home" src="/manus-storage/home-reference_0781ecf9.png" alt="Hatem artwork: a dark red and black hero composition with a hand-drawn character" />
        <nav class="hotspot-nav" aria-label="Primary navigation">
          <a class="hotspot hotspot--home" href="/" aria-label="Home"></a>
          <a class="hotspot hotspot--about" href="#about" aria-label="About"></a>
          <a class="hotspot hotspot--skills" href="#skills" aria-label="Skills"></a>
          <a class="hotspot hotspot--projects" href="#projects" aria-label="Projects"></a>
          <a class="hotspot hotspot--contact" href="/contact" aria-label="Contact"></a>
          <a class="hotspot hotspot--github" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="GitHub"></a>
          <a class="hotspot hotspot--youtube" href="https://youtube.com/" target="_blank" rel="noreferrer" aria-label="YouTube"></a>
          <a class="hotspot hotspot--x" href="https://x.com/" target="_blank" rel="noreferrer" aria-label="X"></a>
          <a class="hotspot hotspot--instagram" href="https://instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram"></a>
        </nav>
        <div class="home-actions" aria-label="Hero actions">
          <a class="hotspot hotspot--explore" href="#about" aria-label="Explore"></a>
          <a class="hotspot hotspot--hero-contact" href="/contact" aria-label="Contact Hatem"></a>
        </div>
        <a class="hotspot hotspot--scroll" href="#about" aria-label="Scroll down"></a>
        <span id="about" class="anchor-target" aria-hidden="true"></span>
        <span id="skills" class="anchor-target" aria-hidden="true"></span>
        <span id="projects" class="anchor-target" aria-hidden="true"></span>
      </section>
    </main>
    <script src="/script.js" defer></script>
  </body>
</html>
