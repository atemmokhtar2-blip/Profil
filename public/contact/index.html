<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Contact Hatem — let's create something great together." />
    <title>HATEM — Contact</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page page-contact">
      <header class="site-header container">
        <a class="brand" href="/" aria-label="Hatem home">HATEM</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
        <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
          <a href="/">Home</a><a href="/#about">About</a><a href="/#skills">Skills</a><a href="/#projects">Projects</a><a class="is-active" href="/contact">Contact</a>
          <span class="socials" aria-label="Contact links"><a href="mailto:atemmokhtar2@gmail.com" aria-label="Email">✉</a><a href="https://www.instagram.com/7ate_m2/" target="_blank" rel="noreferrer" aria-label="Instagram">◎</a></span>
        </nav>
      </header>
      <main class="contact-main container">
        <section class="contact-intro" aria-labelledby="contact-title">
          <p class="eyebrow">GET IN TOUCH</p>
          <h1 id="contact-title">CONTACT <em>ME</em></h1>
          <div class="contact-details">
            <p><span class="detail-icon">✉</span><span><strong>Email</strong><br /><a class="contact-value" href="mailto:atemmokhtar2@gmail.com">atemmokhtar2@gmail.com</a></span></p>
            <p><span class="detail-icon">◉</span><span><strong>WhatsApp</strong><br />@h_a_t_e_m_7</span></p>
            <p><span class="detail-icon">●</span><span><strong>Location</strong><br />Egypt</span></p>
            <p><span class="detail-icon">↗</span><span><strong>Social Media</strong></span></p>
            <div class="social-row"><a href="mailto:atemmokhtar2@gmail.com" aria-label="Email">✉</a><a href="https://www.instagram.com/7ate_m2/" target="_blank" rel="noreferrer" aria-label="Instagram">◎</a></div>
          </div>
          <p class="contact-signoff">LET'S CREATE<br />SOMETHING GREAT<br />TOGETHER</p>
        </section>
        <section class="contact-panel" aria-label="Contact form">
          <form id="contact-form">
            <label for="name">Your Name</label><input id="name" name="name" type="text" placeholder="Your Name" autocomplete="name" required />
            <label for="email">Your Email</label><input id="email" name="email" type="email" placeholder="Your Email" autocomplete="email" required />
            <label for="message">Your Message</label><textarea id="message" name="message" placeholder="Your Message" required></textarea>
            <button class="btn btn-primary" type="submit">Send message <span>→</span></button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
          <div class="contact-art"><img src="/assets/contact-character-1200w.jpg" srcset="/assets/contact-character-320w.jpg 320w, /assets/contact-character-640w.jpg 640w, /assets/contact-character-1200w.jpg 1200w" sizes="(max-width: 520px) 80vw, (max-width: 900px) 70vw, 34vw" alt="Dark character surrounded by chain and red ink" /></div>
        </section>
      </main>
    </div>
    <script src="/script.js" defer></script>
  </body>
</html>
