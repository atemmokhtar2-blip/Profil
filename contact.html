<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="description" content="Contact Hatem — let's create something great together." />
    <title>HATEM — Contact</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="site" class="site-shell" data-page="contact">
      <h1 class="sr-only" id="page-title">Contact Hatem</h1>
      <section class="artboard artboard--contact" aria-labelledby="page-title">
        <img class="reference-art reference-art--contact" src="/manus-storage/contact-reference_4e50d580.png" alt="Hatem contact artwork with red, black, and white anime graffiti styling" />
        <nav class="hotspot-nav" aria-label="Primary navigation">
          <a class="hotspot hotspot--home" href="/" aria-label="Home"></a>
          <a class="hotspot hotspot--about" href="/#about" aria-label="About"></a>
          <a class="hotspot hotspot--skills" href="/#skills" aria-label="Skills"></a>
          <a class="hotspot hotspot--projects" href="/#projects" aria-label="Projects"></a>
          <a class="hotspot hotspot--contact" href="/contact" aria-label="Contact"></a>
          <a class="hotspot hotspot--github" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="GitHub"></a>
          <a class="hotspot hotspot--youtube" href="https://youtube.com/" target="_blank" rel="noreferrer" aria-label="YouTube"></a>
          <a class="hotspot hotspot--x" href="https://x.com/" target="_blank" rel="noreferrer" aria-label="X"></a>
          <a class="hotspot hotspot--instagram" href="https://instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram"></a>
        </nav>
        <div class="contact-form-layer">
          <form id="contact-form" novalidate>
            <label class="sr-only" for="name">Your Name</label>
            <input id="name" name="name" type="text" placeholder="Your Name" autocomplete="name" required />
            <label class="sr-only" for="email">Your Email</label>
            <input id="email" name="email" type="email" placeholder="Your Email" autocomplete="email" required />
            <label class="sr-only" for="message">Your Message</label>
            <textarea id="message" name="message" placeholder="Your Message" required></textarea>
            <button type="submit" aria-label="Send message">Send message</button>
            <p id="form-status" class="sr-only" aria-live="polite"></p>
          </form>
        </div>
        <a class="hotspot hotspot--social-github" href="https://github.com/" target="_blank" rel="noreferrer" aria-label="GitHub social link"></a>
        <a class="hotspot hotspot--social-youtube" href="https://youtube.com/" target="_blank" rel="noreferrer" aria-label="YouTube social link"></a>
        <a class="hotspot hotspot--social-x" href="https://x.com/" target="_blank" rel="noreferrer" aria-label="X social link"></a>
        <a class="hotspot hotspot--social-instagram" href="https://instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram social link"></a>
      </section>
    </main>
    <script src="/script.js" defer></script>
  </body>
</html>
